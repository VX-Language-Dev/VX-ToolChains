# vx-toolkit — uv 安装包装（Python 包只做命令转发，工具链本体是 C++ 二进制）
#
# 安装：
#   python3 python/scripts/stage.py      # 先把 CMake 产物 + headers 装进包内 _bin/
#   uv tool install ./python             # 再安装，得到 vxc / vlnk / vmake / vxls ...
#
# 所有 console script 都指向同一个转发入口，按脚本名分派到对应二进制；
# 二进制查找顺序见 src/vx_toolkit/_dispatch.py。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vx-toolkit"
version = "1.16.0"
description = "VX language toolchain (vxc, vlnk, vmake, vxls) installed through uv"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
keywords = ["vx", "compiler", "toolchain", "lsp", "build"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Environment :: Console",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
vxc = "vx_toolkit._dispatch:main"
vlnk = "vx_toolkit._dispatch:main"
vmake = "vx_toolkit._dispatch:main"
vxls = "vx_toolkit._dispatch:main"
vmake-lsp = "vx_toolkit._dispatch:main"
vx = "vx_toolkit._dispatch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vx_toolkit"]
# _bin/ 里是 stage.py 复制的 C++ 二进制与 headers，必须强制进入 wheel
#（仓库 .gitignore 规则会让 hatchling 默认忽略它们）。
artifacts = ["src/vx_toolkit/_bin/**"]
include = ["src/vx_toolkit/_bin/**"]
