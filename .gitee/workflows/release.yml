name: 🚀 Release / 发布
on:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Go 工具链
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum

      # ── 构建 ────────────────────────────────────
      - name: 📦 go build — Release
        run: |
          go build -ldflags "-s -w" -trimpath -o bin/vxc ./cmd/vxc/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vlnk ./cmd/vlnk/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vdlnk ./cmd/vdlnk/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vxde ./cmd/vxde/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vxlsp ./cmd/vxlsp/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vpm ./cmd/vpm/main.go

      # ── 打包 ────────────────────────────────────
      - name: 📦 打包二进制 + 标准库 + 文档
        run: |
          TAG="${GITHUB_REF_NAME:-$GITEE_REF_NAME}"
          VERSION="${TAG#v}"
          ARCH="linux-x86_64"
          PKG_DIR="vx-toolchains-${VERSION}"
          PKG_FILE="VX-ToolChains-${VERSION}-${ARCH}.tar.gz"

          mkdir -p "../dist/${PKG_DIR}"
          for bin in vxc vlnk vpm vxde vdlnk; do
            cp "bin/$bin" "../dist/${PKG_DIR}/"
          done

          cp -r ../std "../dist/${PKG_DIR}/stdlib"
          cp ../README.md ../CHANGELOG.md ../LICENSE "../dist/${PKG_DIR}/"

          cd ../dist
          tar czf "${PKG_FILE}" "${PKG_DIR}/"
          echo "✅ 打包完成: ${PKG_FILE}  ($(du -sh "${PKG_FILE}" | cut -f1))"

      # ── 通过 Gitee API 创建 Release ──────────────
      - name: 🚀 创建 Release（Gitee API）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG_NAME:   ${{ github.ref_name }}
        run: |
          cd ..
          GITEE_REPO="${GITHUB_REPOSITORY:-$GITEE_REPOSITORY}"

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "access_token": "${GITEE_TOKEN}",
            "tag_name": "${TAG_NAME}",
            "name": "VX-ToolChains ${TAG_NAME}",
            "body": "$(sed -n "/^## /{p; :a; n; /^## /q; p; ba}" CHANGELOG.md | sed 's/"/\\"/g')",
            "prerelease": false
          }
          EOF
          )")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "❌ 创建 Release 失败: $(echo "$RESPONSE" | jq -r '.message // .')"
            exit 1
          fi
          echo "✅ Release 已创建 (ID: ${RELEASE_ID})"

          echo "⏫ 上传构建产物..."
          PKG_FILE="VX-ToolChains-${VERSION}-${ARCH}.tar.gz"
          UPLOAD_URL="https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files"
          curl -s -X POST "${UPLOAD_URL}" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@dist/${PKG_FILE}" \
            | jq -r '. || "上传完成"'
