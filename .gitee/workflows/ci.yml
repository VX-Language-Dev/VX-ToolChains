name: 🔧 CI / 测试 & 代码质量

on:
  push:
    branches:
      - main
      - Beta
  pull_request:
    branches:
      - main
      - Beta

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.55.2'

jobs:
  # ── Lint 检查 ──────────────────────────────
  lint:
    name: 🔍 Lint & 格式检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Go 工具链
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: 安装 golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: go
          args: --config ../.golangci.yml ./...

      - name: 🎨 检查代码格式化
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要格式化:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ 所有代码已正确格式化"

      - name: 📦 检查 imports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          unformatted=$(goimports -local github.com/vx-lang/vxc -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要格式化 imports:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ 所有 imports 已正确格式化"

  # ── Go 构建 & 测试 ──────────────────────────────
  build-and-test:
    name: 🏗️ 构建 & 测试
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: go
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Go 工具链
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: 📦 go build — 所有工具
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -trimpath -o bin/vxc ./cmd/vxc/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vlnk ./cmd/vlnk/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vdlnk ./cmd/vdlnk/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vxde ./cmd/vxde/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vxlsp ./cmd/vxlsp/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vpm ./cmd/vpm/main.go
          go build -ldflags "-s -w" -trimpath -o bin/vfmt ./cmd/vfmt/main.go

      - name: ✅ 验证构建产物
        run: |
          errors=0
          for bin in vxc vlnk vdlnk vxde vxlsp vpm vfmt; do
            path="bin/${bin}"
            if [ -f "$path" ]; then
              size=$(du -h "$path" | cut -f1)
              echo "  ✅ ${bin}  (${size})"
            else
              echo "  ❌ ${bin}  缺失!"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ] || exit 1

      - name: 🧪 go test — 单元测试（含覆盖率）
        run: |
          go test ./internal/... -v -race -coverprofile=coverage.out -covermode=atomic
          echo ""
          echo "=== 覆盖率摘要 ==="
          go tool cover -func=coverage.out | tail -1

      - name: 📊 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          file: go/coverage.out
          flags: unittests
          name: vx-toolkit-coverage
          fail_ci_if_error: false

      - name: ⚡ 性能基准测试
        run: |
          echo "运行基准测试..."
          go test ./internal/... -bench=. -benchmem -run=^$$ -timeout=10m | tee benchmark.txt
          echo ""
          echo "=== 基准测试完成 ==="

      - name: 🏃 竞态检测
        run: |
          echo "运行竞态检测..."
          go test ./internal/... -race -count=5
          echo "✅ 未发现竞态条件"

  # ── 安全扫描 ──────────────────────────────
  security:
    name: 🔒 安全扫描
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: go
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Go 工具链
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 运行安全扫描 (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          echo "✅ 安全扫描通过"

      - name: 检查依赖漏洞
        run: |
          go list -m -json all | dependency-check || true
          echo "⚠️ 依赖检查完成（详细信息见上方输出）"

  # ── 最终状态 ──────────────────────────────
  status:
    name: ✅ 最终状态
    needs: [build-and-test, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 检查所有任务状态
        run: |
          if [ "${{ needs.build-and-test.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ]; then
            echo "❌ CI 失败"
            exit 1
          else
            echo "🎉 CI 全部通过"
          fi